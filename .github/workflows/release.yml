name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      sri: ${{ steps.sri.outputs.sri }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      - run: npm run build

      - name: Compute SRI hash
        id: sri
        run: |
          HASH=$(openssl dgst -sha384 -binary dist/arknights-name-input.js | openssl base64 -A)
          printf 'sha384-%s\n' "$HASH" > sri.txt
          echo "sri=sha384-$HASH" >> "$GITHUB_OUTPUT"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: |
            dist/arknights-name-input.js
            dist/arknights-name-input.js.map
            sri.txt
          if-no-files-found: error

  e2e:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore

  release:
    needs: [build, e2e]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: release-assets

      - name: Attach dist to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/arknights-name-input.js
            release-assets/arknights-name-input.js.map
            release-assets/sri.txt
          generate_release_notes: true
          append_body: true
          body: |
            **SRI integrity（README「方式 B」引用脚本时推荐添加）**

            ```
            integrity="${{ needs.build.outputs.sri }}" crossorigin="anonymous"
            ```
