<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>明日方舟干员名输入组件</title>
    <script src="./dist/arknights-name-input.js"></script>
  </head>
  <body>
    <p style="max-width: 22rem; margin: 8px auto 0; color: #666; font-size: 13px; line-height: 1.6;">
      <strong style="color: #e74c3c;">⚠️ 重要：</strong>拼音搜索需要使用<strong>英文输入法</strong>输入（如 <code>linglan</code>、<code>ll</code>）。
      使用中文输入法时，字母会被提前转换成汉字，导致拼音匹配失效。
    </p>
    <arknights-name-input
      id="operator"
      placeholder="输入干员名称或拼音"
      max-results="8"
    ></arknights-name-input>
    <pre id="output">尚未选择</pre>
    <script>
      document.querySelector('#operator').addEventListener('character-select', (event) => {
        document.querySelector('#output').textContent = JSON.stringify(event.detail, null, 2);
      });
    </script>
  </body>
</html>
